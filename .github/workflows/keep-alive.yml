name: Keep Render Service Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://global-ace-gaming-backend.onrender.com' }}
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 "$BACKEND_URL/health"
