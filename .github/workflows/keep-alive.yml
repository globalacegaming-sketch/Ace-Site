name: Keep Render Service Alive

on:
  schedule:
    # Render free web services sleep after about 15 minutes without traffic.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping Render Service
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://global-ace-gaming-backend.onrender.com' }}
        run: |
          url="${BACKEND_URL%/}/health"
          echo "Pinging $url"
          # A sleeping Render service often needs more than 60 seconds to boot.
          # The previous curl used --max-time 60 for a single attempt, so the job
          # died at about one minute and GitHub emailed "ping failed" every run.
          # Give the cold start a full window, then try once more after it has
          # had time to finish booting.
          if curl -fsS --connect-timeout 30 --max-time 120 "$url"; then
            exit 0
          fi
          echo "First ping did not succeed. Waiting for the instance to finish starting."
          sleep 20
          curl -fsS --connect-timeout 30 --max-time 90 "$url"
